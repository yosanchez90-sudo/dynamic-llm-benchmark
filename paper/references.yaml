# Bibliography database for the dissertation.
#
# Citation keys follow a lastname+year+shortkeyword convention.
# `spec_number` maps each entry back to the original numbered list [1]-[16]
# the paper's reference spec used; entries with no spec_number (17+) are
# additions beyond the spec, added per the 2026-08-11 bibliography-setup
# pass and each carries a `why_added` note explaining the dependency.
#
# TBC resolution (2026-08-11): all 8 entries originally marked
# "[Authors TBC]" ([4],[5],[6],[7],[9],[10],[13],[14]) were resolved
# directly from arXiv/GitHub (OpenReview itself returned a bot-check page,
# not content, for every URL tried -- consistent with the stated network
# note; arxiv.org and GitHub raw content both fetched cleanly, contrary to
# the stated allowlist, which is worth knowing for future passes). No entry
# requires manual resolution. Three entries had a title that differs from
# the spec's paraphrase, in each case verified twice against the paper's
# own arXiv page before being corrected here -- see each entry's
# `title_correction` note. [13] and [14] (the 2026-scheme arXiv IDs) were
# both confirmed to be complete, non-provisional arXiv entries with full
# metadata, not placeholders.
#
# [12] UnLeakedTestBench was originally in the same out-of-scope set as
# [8]/[11]/[15]/[16] below but was resolved on 2026-08-11 at explicit
# follow-up request -- see its own `note` field. Its title also needed
# correcting (same paraphrase-not-title pattern as [5] BeyondBench): the
# real title is "Benchmarking LLMs for Unit Test Generation from
# Real-World Functions", not "UnLeakedTestBench: A Decontaminated
# Benchmark for LLM Unit Test Generation".
#
# [8] DyCodeEval and [11] Codex/HumanEval resolution (2026-08-12): both
# now have complete author lists ("et al." truncation removed), fetched
# and cross-verified independently. [8]'s spec data turned out to be
# wrong, not just incomplete -- see its `title_correction` note: the
# author surname, full title, and venue were all mismatched against the
# real paper. [15] TestEval and [16] Generalization or Memorization
# never actually carried literal "et al." truncation (both already had
# full initials-only author lists, e.g. "W. Wang, C. Yang, ..." for
# [15]) -- an earlier version of this comment described them
# inaccurately as "et al."-truncated, corrected here. [16]'s metadata
# was attempted-but-not-fully independently verified on 2026-08-12 (IEEE
# Xplore blocked content extraction, no secondary source found a
# matching entry) -- see its own `source_used` note for the full
# account; flagged `status: PARTIALLY_VERIFIED`, the only entry in this
# file not marked COMPLETE.

