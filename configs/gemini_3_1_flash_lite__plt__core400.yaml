# Comparison A/B: Gemini 3.1 Flash-Lite on the pinned core_400 PLT subsample,
# zero-shot. API model — no GPU needed; runs on k2-medpri via run_eval_api.slurm.
# core_400 is the universal 400-problem CC-stratified subsample every model
# (closed-source + Qwen) shares — see data/raw/ult_plt/subsample_manifest.json.
# Model updated 2026-07-14: gemini-2.5-flash retired ("no longer available to
# new users") — see PROJECT_BRIEF.md Sec 11. 3.1 Flash-Lite is cheaper per
# token than 2.5-flash was, so the old $0.64 estimate is a safe upper bound,
# but get real per-problem cost from a small run before trusting a number.

name: gemini_3_1_flash_lite__plt__core400__zeroshot

task: test_generation

model:
  provider: gemini
  id: gemini-3.1-flash-lite
  revision: gemini-3.1-flash-lite

benchmark: plt
subsample_tag: core_400
instantiation_id: "core_400"

prompting_condition: zero_shot

generation:
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.2
  top_p: 1.0
  seed: 42

K: 1
mutation_workers: 4
mutant_timeout_seconds: 30

output_dir: data/results/plt
