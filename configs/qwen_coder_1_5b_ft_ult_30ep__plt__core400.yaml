# repetition_penalty/top_k being inherited from the checkpoint (verified via
# scripts/verify_ult_adapter.py) rather than configurable here.

name: qwen_coder_1_5b_ft_ult_30ep__plt__core400__zeroshot

task: test_generation

model:
