# Comparison C, Gate C Stage 3b: POST-fine-tune eval of the canonical
# Qwen-1.5B-on-ULT LoRA adapter on PLT core_400 -- mirrors
# configs/qwen_coder_1_5b__plt__core400.yaml (the PRE baseline config, verified
