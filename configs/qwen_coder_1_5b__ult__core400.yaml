# (closed-source + Qwen) shares — see data/raw/ult_plt/subsample_manifest.json
# and data/raw/ult_plt/PROVENANCE.md for the nested core_400/qwen_1000 design.

name: qwen_coder_1_5b__ult__core400__zeroshot

task: test_generation

model:
  provider: local
  id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  revision: 2e1fd397ee46e1388853d2af2c993145b0f1098a
  dtype: bfloat16

benchmark: ult
subsample_tag: core_400
instantiation_id: "core_400"         # ULT/PLT have no real instantiations; fixed tag for filenames

prompting_condition: zero_shot

generation:
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.2
  top_p: 1.0
  seed: 42

K: 1
mutation_workers: 4                  # must match --cpus-per-task in run_l1l2_pilot.slurm
mutant_timeout_seconds: 30

output_dir: data/results/ult
