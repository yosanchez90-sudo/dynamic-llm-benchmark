# Comparison A/B: Claude Sonnet 4.6 on the pinned core_400 ULT subsample,
# zero-shot. API model — no GPU needed; runs on k2-medpri via run_eval_api.slurm.
# core_400 is the universal 400-problem CC-stratified subsample every model
# (closed-source + Qwen) shares — see data/raw/ult_plt/subsample_manifest.json.
# Cost estimate (2026-07-13, real-time rates): ~$3.94 for this config.

name: claude_sonnet_4_6__ult__core400__zeroshot

task: test_generation

model:
  provider: anthropic
  id: claude-sonnet-4-6-20250620        # pinned snapshot (CLAUDE.md: no -latest tags)
  revision: claude-sonnet-4-6-20250620

benchmark: ult
subsample_tag: core_400
instantiation_id: "core_400"

prompting_condition: zero_shot

generation:
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.2
  top_p: 1.0
  seed: 42

K: 1
mutation_workers: 4
mutant_timeout_seconds: 30

output_dir: data/results/ult
