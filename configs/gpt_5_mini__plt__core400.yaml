# Comparison A/B: GPT-5-mini on the pinned core_400 PLT subsample, zero-shot.
# This config is for scripts/create_batch.py, whose default (no --submit
# flag) only writes the batch input JSONL — never sbatch'd or hit with a
# real API call by this config alone. Historically the supervisor held the
# OpenAI credits and submitted the prepared JSONL; as of 2026-08-05 the
# batch can equally be self-funded on your own key (see
# analysis/OPENAI_COST_AND_BILLING.md) — either way, submission is a
# separate, explicit --submit step, not something this config triggers.
# core_400 is the universal 400-problem CC-stratified subsample every model
# (closed-source + Qwen) shares — see data/raw/ult_plt/subsample_manifest.json.

name: gpt_5_mini__plt__core400__zeroshot

task: test_generation

model:
  provider: openai
  id: gpt-5-mini-2025-08-07
  revision: gpt-5-mini-2025-08-07

benchmark: plt
subsample_tag: core_400
instantiation_id: "core_400"

prompting_condition: zero_shot

generation:
  max_new_tokens: 16384
  do_sample: true
  temperature: 0.2               # ignored for reasoning models — see create_batch.py _FIXED_TEMP_MODELS
  top_p: 1.0
  seed: 42

K: 1
mutation_workers: 4
mutant_timeout_seconds: 30

output_dir: data/results/plt
