# Test-generation L1+L2 pilot: GPT-5-mini on dynamic benchmark, zero-shot.
# API model — no GPU needed; runs on k2-medpri via run_eval_api.slurm.
# Cost estimate: 150 problems × ~600 input tokens × ~400 output tokens
#   ≈ 150 × (600×0.75 + 400×4.50) / 1e6 ≈ $0.34

name: gpt_5_mini__dynamic_L1L2__zeroshot__inst1

task: test_generation

model:
  provider: openai
  id: gpt-5-mini-2025-08-07          # pinned snapshot (CONVENTIONS.md: no aliases)
  revision: gpt-5-mini-2025-08-07   # for closed APIs, revision = snapshot string

benchmark: dynamic
instantiation_id: "1"
instantiation_seed: 1
instance_seeds: [101, 102, 103, 104, 105]
tiers: ["L1", "L2"]

prompting_condition: zero_shot

generation:
  max_new_tokens: 8192               # Reasoning models consume tokens for hidden CoT
  do_sample: true                    # before writing output. 2048 was too small —
  temperature: 0.2                   # gpt-5-mini used all 2048 on reasoning, leaving
  top_p: 1.0                         # nothing for the test file. 8192 gives ~6000 for
  seed: 42                           # reasoning + ~2000 for output (ample for a test file).

K: 1
mutation_workers: 4                  # CPU-only scoring; match --cpus-per-task
mutant_timeout_seconds: 30

output_dir: data/results/dynamic
