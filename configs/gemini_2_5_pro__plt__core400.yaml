# Comparison A/B: Gemini 2.5 Pro on the pinned core_400 PLT subsample,
# zero-shot. API model — no GPU needed; runs on k2-medpri via run_eval_api.slurm.
# core_400 is the universal 400-problem CC-stratified subsample every model
# (closed-source + Qwen) shares — see data/raw/ult_plt/subsample_manifest.json.
# Cost estimate (2026-07-13, real-time rates): ~$2.56 for this config.

name: gemini_2_5_pro__plt__core400__zeroshot

task: test_generation

model:
  provider: gemini
  id: gemini-2.5-pro
  revision: gemini-2.5-pro

benchmark: plt
subsample_tag: core_400
instantiation_id: "core_400"

prompting_condition: zero_shot

generation:
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.2
  top_p: 1.0
  seed: 42

K: 1
mutation_workers: 4
mutant_timeout_seconds: 30

output_dir: data/results/plt
