# Canonical Comparison C (PROJECT_BRIEF.md Sec 7/Sec 11): Qwen 1.5B LoRA
# fine-tuned on ULT's own (repair-verified) ground-truth tests, 30 epochs.
# LoRA hyperparameters mirror the six supplementary Dynamic-trained runs
# (configs/finetune_qwen1_5b_inst1_30ep.yaml etc.) for cross-experiment
# comparability -- only `data` differs, since this training set was built
# by scripts/repair_ult_ground_truth.py, not scripts/prepare_finetune_data.py
# (see data/raw/ult_plt/PROVENANCE.md). Training data is already frozen at
# data.train_file -- do NOT run prepare_finetune_data.py against this config.

name: finetune_qwen1_5b_ult_30ep

model:
  id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  revision: 2e1fd397ee46e1388853d2af2c993145b0f1098a
  dtype: bfloat16

lora:
  r: 64
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: data/finetune/qwen1_5b_lora_ult_30ep
  num_train_epochs: 30
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_length: 3072
  dataset_text_field: text
  save_strategy: epoch
  save_total_limit: 31
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  seed: 42

data:
  train_file: data/finetune/train_ult_final.jsonl
