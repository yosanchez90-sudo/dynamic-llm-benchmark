  id: claude-haiku-4-5-20251001
  revision: claude-haiku-4-5-20251001

benchmark: dynamic
instantiation_id: "3"
instantiation_seed: 3
instance_seeds: [101, 102, 103, 104, 105]
tiers: ["L3", "L4"]

