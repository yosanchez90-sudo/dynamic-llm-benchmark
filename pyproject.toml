[project]
name = "dissertation"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate>=1.13.0",
    "anthropic>=0.101.0",
    "bitsandbytes>=0.49.2",
    "coverage>=7.14.1",
    "datasets>=3.0.0",
    "diskcache>=5.6.3",
    "einops>=0.8.2",
    "gnureadline>=8.3.3",
    "google-genai>=2.0.1",
    "huggingface-hub>=0.36.2",
    "inspect-ai>=0.3.220",
    "litellm>=1.83.0",
    "matplotlib>=3.10.9",
    "openai>=2.36.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "sacrebleu>=2.6.0",
    "scipy>=1.15.3",
    "sentencepiece>=0.2.1",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.57.6",
    "vllm>=0.7.3",
    "wandb>=0.26.1",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
# Scope bare `pytest`/`pytest -q` (no path argument) to tests/ only, per
# CLAUDE.md's "Tests in `tests/`, run with `pytest`" convention. Without
# this, pytest's default rootdir-wide collection walks template_corpus/
# too, which previously crashed collection entirely with an INTERNALERROR
# on template_corpus/templates/_smoke/test_grammar.py (a standalone script
# with a top-level sys.exit(), not a pytest file -- renamed to
# grammar_selfcheck.py 2026-08-04 as the primary fix; this setting is the
# second, independent layer so no future _smoke/test_*.py-named script can
# reintroduce the same trap for anyone running `pytest` from repo root).
testpaths = ["tests"]
